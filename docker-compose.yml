services:
  app:
    image: phpmyadmin/phpmyadmin
    container_name: app
    restart: unless-stopped
    networks:
      - web_net

  webserver:
    image: nginx:stable-alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - web_net

networks:
  web_net:
